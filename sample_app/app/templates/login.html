<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Sample App</title>
    <link rel="stylesheet" href="{{ base_path }}/static/pico.min.css">
    <link rel="stylesheet" href="{{ base_path }}/static/app.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>Sample App</h1>
            <p class="login-subtitle">Meetr Partner Integration Example</p>

            {% if error %}
            <div class="alert alert-error" role="alert">
                {{ error }}
                <button class="close-alert" onclick="this.parentElement.remove()">&times;</button>
            </div>
            {% endif %}

            <form method="post" action="{{ base_path }}/login">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="you@example.com" required autofocus>

                <label for="password">Password</label>
                <input type="password" name="password" id="password" required>

                <button type="submit">Login</button>
            </form>
            <p class="register-link">Don't have an account? <a href="{{ base_path }}/register">Create one</a></p>
        </div>
    </div>
</body>
</html>

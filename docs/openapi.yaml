openapi: 3.1.0
info:
  title: Meetr - AI Meeting Assistant
  description: Meetr automates meeting scheduling by contacting participants, collecting
    availability through natural conversations (SMS, WhatsApp, voice), and selecting
    optimal meeting times.
  contact:
    name: Meetr Support
    email: support@meetr.io
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - Health
      summary: Liveness probe
      description: 'Fast liveness check — no database call.


        Returns `{"status": "healthy"}`. Use for container liveness probes.'
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Check Health Get
      security: []
  /health/detailed:
    get:
      tags:
      - Health
      summary: Readiness probe
      description: 'Deep readiness check including database, workers, and active sessions.


        Returns overall status (`healthy`, `degraded`, or `unhealthy`) with per-component
        details.

        Use for container readiness probes and monitoring dashboards.'
      operationId: health_detailed_health_detailed_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Detailed Health Detailed Get
      security: []
  /api/meetings:
    post:
      tags:
      - Meetings
      summary: Create a meeting request
      description: 'Create a new meeting scheduling session.


        Outreach to participants begins automatically after creation. Each participant

        is contacted via their preferred communication channel(s) to collect availability.


        See the field reference in the integration guide for the complete request
        schema.


        **Rate limit:** 20 requests per minute (in addition to the general rate limit).


        **Behavior:**

        - Returns the `session_id` used for all subsequent operations

        - Outreach starts immediately unless `skip_outreach` is set on individual
        participants

        - Participants with `skip_outreach: true` must include `availability_slots`

        - Rate limited per partner (429 if exceeded)'
      operationId: create_meeting_api_meetings_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeetingRequestSchema'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_CreateMeetingResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Meetings
      summary: List meetings
      description: 'List meetings with pagination and optional filtering.


        **Query parameters:**

        - `limit` / `offset` — pagination (default: 20 items)

        - `state` — filter by meeting state: `PENDING`, `COLLECTING`, `AWAITING_RESPONSES`,
        `SELECTING_SLOT`, `NEEDS_INTERVENTION`, `CONFIRMING`, `AWAITING_CONFIRMATIONS`,
        `COMPLETED`, `FAILED`, `CANCELLED`

        - `external_id` — filter by your external correlation ID

        - `created_after` / `created_before` — date range filter (ISO 8601)


        Results are wrapped in a standard envelope with `meta.total` for pagination.'
      operationId: list_meetings_api_meetings_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: State
      - name: external_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: External Id
      - name: created_after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created After
      - name: created_before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created Before
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_list_MeetingListItem__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/meetings/{session_id}:
    get:
      tags:
      - Meetings
      summary: Get meeting detail
      description: 'Return full detail for a single meeting.


        Includes participant list with per-participant outreach status, availability

        slots, confirmation status, and the selected meeting slot (if any).'
      operationId: get_meeting_status_api_meetings__session_id__get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_MeetingDetail_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/meetings/{session_id}/cancel:
    post:
      tags:
      - Meetings
      summary: Cancel a meeting
      description: 'Cancel a meeting and stop all active outreaches.


        Active sessions are terminated and participants are notified of the

        cancellation. The optional `reason` field is stored and included in notifications.


        **Behavior:**

        - Cancelling a `COMPLETED` meeting is allowed (sends cancellation notices)

        - Returns `success: false` (not an error) for `FAILED` or `CANCELLED` meetings

        - All active outreach sessions are terminated immediately


        **Request body (optional):**


        | Field | Type | Required | Description |

        |-------|------|----------|-------------|

        | `reason` | string | no | Human-readable cancellation reason |'
      operationId: cancel_meeting_api_meetings__session_id__cancel_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CancelMeetingRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_CancelMeetingResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/meetings/{session_id}/intervene:
    post:
      tags:
      - Meetings
      summary: Intervene on a meeting
      description: 'Send a natural-language instruction to adjust a stuck meeting.


        The intervention is processed by an LLM that interprets the instruction

        and applies appropriate actions (e.g. extend scheduling window, adjust

        participant priority, retry outreach).


        **Request body:**


        | Field | Type | Required | Description |

        |-------|------|----------|-------------|

        | `message` | string | yes | Natural-language intervention instruction |'
      operationId: intervene_meeting_api_meetings__session_id__intervene_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterventionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_InterventionResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/keys/rotate:
    post:
      tags:
      - Keys
      summary: Rotate API key
      description: 'Create a new API key while keeping old key(s) active for a grace
        period.


        The new key is returned in the response and shown only once — store it securely.


        **Rate limit:** 5 requests per hour (in addition to the general rate limit).


        **Request body:**


        | Field | Type | Required | Description |

        |-------|------|----------|-------------|

        | `grace_period_hours` | integer | no | Hours before old keys expire (default:
        24, minimum: 1) |'
      operationId: rotate_api_key_api_keys_rotate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateKeyRequest'
              default:
                grace_period_hours: 24
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/customers:
    get:
      tags:
      - Customers
      summary: List customers
      description: 'List all customers under your partner account.


        Customers represent sub-accounts that allow you to segment meetings,

        participants, and rate limits.'
      operationId: list_partner_customers_api_customers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    post:
      tags:
      - Customers
      summary: Create a customer
      description: 'Create a new customer under your partner account.


        **Request body:**


        | Field | Type | Required | Description |

        |-------|------|----------|-------------|

        | `external_id` | string | yes | Your unique identifier for this customer
        |

        | `name` | string | no | Display name |

        | `rate_limit_rpm` | integer | no | Requests per minute limit |

        | `rate_limit_meeting_rpm` | integer | no | Meeting creation requests per
        minute limit |


        Returns `409 Conflict` if a customer with the same `external_id` already exists.'
      operationId: create_partner_customer_api_customers_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/customers/{customer_id}:
    get:
      tags:
      - Customers
      summary: Get customer detail
      description: Get detail for a specific customer by ID.
      operationId: get_partner_customer_api_customers__customer_id__get
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          title: Customer Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Customers
      summary: Update a customer
      description: 'Update a customer''s name or rate limits.


        Only provided fields are updated; omitted fields remain unchanged.'
      operationId: update_partner_customer_api_customers__customer_id__patch
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          title: Customer Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/participants:
    get:
      tags:
      - Participants
      summary: List participants
      description: 'List all participants in your partner''s address book.


        The address book stores participant records that can be reused across meetings.

        Includes resolved customer names for each participant.'
      operationId: list_partner_participants_api_participants_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    post:
      tags:
      - Participants
      summary: Create a participant
      description: 'Create a participant in your partner''s address book.


        **Request body:**


        | Field | Type | Required | Description |

        |-------|------|----------|-------------|

        | `first_name` | string | yes | Participant''s first name |

        | `last_name` | string | yes | Participant''s last name |

        | `phone_number` | string | yes | E.164 format phone number |

        | `customer_id` | string | no | Associate with a customer |

        | `timezone` | string | no | IANA timezone or UTC offset (e.g. `America/New_York`, `UTC+7`) |

        | `language` | string | no | Conversation language: `en`, `fr`, `he` (default:
        `en`) |

        | `communication_modes` | array | no | Ordered channel list: `sms`, `whatsapp`,
        `voice` |


        Returns `409 Conflict` if a participant with the same phone number already
        exists

        for this partner/customer combination.'
      operationId: create_partner_participant_api_participants_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateParticipantRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/participants/{participant_id}:
    get:
      tags:
      - Participants
      summary: Get participant detail
      description: Get detail for a specific participant by ID.
      operationId: get_partner_participant_api_participants__participant_id__get
      parameters:
      - name: participant_id
        in: path
        required: true
        schema:
          type: string
          title: Participant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Participants
      summary: Update a participant
      description: 'Update a participant''s details.


        Only provided fields are updated; omitted fields remain unchanged.'
      operationId: update_partner_participant_api_participants__participant_id__patch
      parameters:
      - name: participant_id
        in: path
        required: true
        schema:
          type: string
          title: Participant Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateParticipantRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/partners/register:
    post:
      tags:
      - Registration
      summary: Register a new partner
      description: 'Self-register as a new partner and receive an API key.


        No authentication required. Store the returned `api_key` securely —

        it is shown only once.


        **Request body:**


        | Field | Type | Required | Description |

        |-------|------|----------|-------------|

        | `name` | string | yes | Your organization name |

        | `contact_email` | string | no | Contact email address |


        **Behavior:**

        - If the partner name already exists, old API keys are revoked and a fresh
        key is issued

        - The returned key is the only active key for the partner'
      operationId: register_partner_api_partners_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPartnerRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Register Partner Api Partners Register Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/webhooks:
    get:
      tags:
      - Webhooks
      summary: List webhook subscriptions
      description: 'List all webhook subscriptions for your partner account.


        Returns both active and inactive subscriptions.'
      operationId: list_subscriptions_api_webhooks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Subscriptions Api Webhooks Get
    post:
      tags:
      - Webhooks
      summary: Subscribe to webhook events
      description: 'Register a webhook endpoint to receive event notifications.


        **Request body:**


        | Field | Type | Required | Description |

        |-------|------|----------|-------------|

        | `url` | string | yes | HTTPS endpoint to receive webhook POST requests |

        | `event_types` | array | yes | Event types to subscribe to |

        | `secret` | string | no | HMAC-SHA256 secret for payload signing |


        **Available event types:** `meeting.state_changed`, `meeting.completed`,

        `meeting.failed`, `meeting.cancelled`, `outreach.updated`, `slot.selected`,

        `confirmation.received`


        If a `secret` is provided, payloads are signed with HMAC-SHA256. The signature

        is sent in the `X-Meetr-Signature` header as `sha256=<hex-digest>`.'
      operationId: subscribe_api_webhooks_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Subscribe Api Webhooks Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/webhooks/{sub_id}:
    delete:
      tags:
      - Webhooks
      summary: Delete a webhook subscription
      description: 'Remove a webhook subscription by ID.


        The subscription is permanently deleted. Returns `404` if not found or

        not owned by your partner.'
      operationId: unsubscribe_api_webhooks__sub_id__delete
      parameters:
      - name: sub_id
        in: path
        required: true
        schema:
          type: string
          title: Sub Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Unsubscribe Api Webhooks  Sub Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ApiMeta:
      properties:
        total:
          type: integer
          title: Total
          description: Total number of items matching the query
        limit:
          type: integer
          title: Limit
          description: Maximum items per page
        offset:
          type: integer
          title: Offset
          description: Number of items skipped
      type: object
      required:
      - total
      - limit
      - offset
      title: ApiMeta
      description: Pagination metadata for list responses.
    ApiResponse_CancelMeetingResponse_:
      properties:
        data:
          $ref: '#/components/schemas/CancelMeetingResponse'
          description: Response payload
        meta:
          anyOf:
          - $ref: '#/components/schemas/ApiMeta'
          - type: 'null'
          description: Pagination metadata (present on list endpoints)
      type: object
      required:
      - data
      title: ApiResponse[CancelMeetingResponse]
    ApiResponse_CreateMeetingResponse_:
      properties:
        data:
          $ref: '#/components/schemas/CreateMeetingResponse'
          description: Response payload
        meta:
          anyOf:
          - $ref: '#/components/schemas/ApiMeta'
          - type: 'null'
          description: Pagination metadata (present on list endpoints)
      type: object
      required:
      - data
      title: ApiResponse[CreateMeetingResponse]
    ApiResponse_InterventionResponse_:
      properties:
        data:
          $ref: '#/components/schemas/InterventionResponse'
          description: Response payload
        meta:
          anyOf:
          - $ref: '#/components/schemas/ApiMeta'
          - type: 'null'
          description: Pagination metadata (present on list endpoints)
      type: object
      required:
      - data
      title: ApiResponse[InterventionResponse]
    ApiResponse_MeetingDetail_:
      properties:
        data:
          $ref: '#/components/schemas/MeetingDetail'
          description: Response payload
        meta:
          anyOf:
          - $ref: '#/components/schemas/ApiMeta'
          - type: 'null'
          description: Pagination metadata (present on list endpoints)
      type: object
      required:
      - data
      title: ApiResponse[MeetingDetail]
    ApiResponse_list_MeetingListItem__:
      properties:
        data:
          items:
            $ref: '#/components/schemas/MeetingListItem'
          type: array
          title: Data
          description: Response payload
        meta:
          anyOf:
          - $ref: '#/components/schemas/ApiMeta'
          - type: 'null'
          description: Pagination metadata (present on list endpoints)
      type: object
      required:
      - data
      title: ApiResponse[list[MeetingListItem]]
    AvailabilitySlotSchema:
      properties:
        start:
          type: string
          title: Start
          description: Slot start time in ISO 8601 format
          examples:
          - '2026-03-21T09:00:00Z'
        end:
          type: string
          title: End
          description: Slot end time in ISO 8601 format
          examples:
          - '2026-03-21T10:00:00Z'
        timezone:
          type: string
          title: Timezone
          description: IANA timezone identifier or UTC offset (e.g. "UTC+7", "UTC-05:00"). UTC offsets are normalized to Etc/GMT equivalents.
          examples:
          - UTC
          - America/New_York
          - UTC+7
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          description: Confidence level for this slot (0.0–1.0)
          default: 1.0
      type: object
      required:
      - start
      - end
      - timezone
      title: AvailabilitySlotSchema
      description: Availability slot provided by a participant.
    CancelMeetingRequest:
      properties:
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Optional cancellation reason
      type: object
      title: CancelMeetingRequest
      description: Request to cancel a meeting.
    CancelMeetingResponse:
      properties:
        success:
          type: boolean
          title: Success
          description: Whether cancellation succeeded
        message:
          type: string
          title: Message
          description: Human-readable result message
        session_id:
          type: string
          title: Session Id
          description: Meeting session UUID
        state:
          type: string
          title: State
          description: Meeting state after cancellation
      type: object
      required:
      - success
      - message
      - session_id
      - state
      title: CancelMeetingResponse
      description: Response from cancelling a meeting.
    CreateCustomerRequest:
      properties:
        external_id:
          type: string
          title: External Id
          description: Your unique identifier for this customer
          examples:
          - cust-001
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Display name for the customer
        rate_limit_rpm:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rate Limit Rpm
          description: Requests per minute limit override
        rate_limit_meeting_rpm:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rate Limit Meeting Rpm
          description: Meeting creation requests per minute limit override
      type: object
      required:
      - external_id
      title: CreateCustomerRequest
      description: Request body for customer creation.
    CreateMeetingRequestSchema:
      properties:
        purpose:
          type: string
          title: Purpose
          description: Meeting purpose shared with participants during outreach
          examples:
          - Quarterly planning and goal setting
        context:
          type: string
          title: Context
          description: Additional context for the conversational agent
        scheduling_window_start:
          type: string
          title: Scheduling Window Start
          description: Earliest date/time to consider (ISO 8601)
          examples:
          - '2026-03-20T00:00:00Z'
        scheduling_window_end:
          type: string
          title: Scheduling Window End
          description: Latest date/time to consider (ISO 8601)
          examples:
          - '2026-03-27T23:59:59Z'
        timezone:
          type: string
          title: Timezone
          description: Default timezone for the meeting — IANA name or UTC offset (e.g. "UTC+7", "UTC-05:00"). UTC offsets are normalized to Etc/GMT equivalents.
          examples:
          - America/New_York
          - UTC+7
        max_scheduling_deadline:
          anyOf:
          - type: string
          - type: 'null'
          title: Max Scheduling Deadline
          description: Hard deadline after which scheduling stops (ISO 8601)
        meeting_duration_minutes:
          type: integer
          exclusiveMinimum: 0.0
          title: Meeting Duration Minutes
          description: Meeting length in minutes
          examples:
          - 30
          - 60
        daily_start_time:
          anyOf:
          - type: string
          - type: 'null'
          title: Daily Start Time
          description: Earliest daily time for meetings (HH:MM)
          examples:
          - 09:00
        daily_end_time:
          anyOf:
          - type: string
          - type: 'null'
          title: Daily End Time
          description: Latest daily time for meetings (HH:MM)
          examples:
          - '17:00'
        participants:
          items:
            $ref: '#/components/schemas/ParticipantSchema'

      type: object
      required:
      - purpose
      - context
      - scheduling_window_start
      - scheduling_window_end
      - timezone
      - meeting_duration_minutes
      - participants
      title: CreateMeetingRequestSchema
      description: Schema for creating a meeting request.
      examples:
      - client_callback_url: https://your-app.com/meetr/callback
        context: Quarterly planning and goal setting for the engineering team
        daily_end_time: '17:00'
        daily_start_time: 09:00
        meeting_duration_minutes: 60
        min_participants_required: 2
        participants:
        - communication_modes:
          - whatsapp
          - sms
          first_name: Alice
          last_name: Martin
          phone_number: '+1234567890'
          priority: 5
        - communication_modes:
          - sms
          first_name: Bob
          last_name: Chen
          phone_number: +0987654321
          priority: 3
        purpose: Q1 Planning
        scheduling_window_end: '2026-03-27T23:59:59Z'
        scheduling_window_start: '2026-03-20T00:00:00Z'
        timezone: America/New_York

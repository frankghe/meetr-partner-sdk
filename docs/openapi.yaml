          - type: 'null'
          title: External Id
          description: Your external identifier for correlation
        manager:
          anyOf:
          - $ref: '#/components/schemas/ParticipantSchema'
          - type: 'null'
          description: Manager info for intervention notifications (name, phone, etc.)
        intervention_notification:
          anyOf:
          - type: string
          - type: 'null'
